environment: prod

image:
  name: SET-BY-CICD-IMAGE
  tag: SET-BY-CICD-TAG
  imagePullPolicy: IfNotPresent  # Always|IfNotPresent|Never

resources:
  requests:
    cpu: "0.5"
    memory: "100Mi"
  limits:
    cpu: "1"
    memory: "100Mi"

ingress:
  host:
  className:
  tls:
    enabled: false
    secretName:

env:
  APP_TITLE: "Alert hub"
  APP_ENVIRONMENT: alpha
  APP_MAPBOX_ACCESS_TOKEN:
  APP_GOOGLE_ANALYTICS_ID:
  APP_GRAPHQL_API_ENDPOINT: https://alerthub-api.ifrc.org/graphql/
  APP_HCAPTCHA_SITEKEY:
