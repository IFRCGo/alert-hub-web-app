version: '3.8'
services:
  react:
    build: .
    command: sh -c 'yarn install && yarn start --host'
    volumes:
      - .:/code
    ports:
      - '3000:3000'
    environment:
      APP_TITLE: ${APP_TITLE:-IFRC Alert Hub}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-testing}
      APP_GRAPHQL_API_ENDPOINT: ${APP_GRAPHQL_API_ENDPOINT:-http://localhost:8000/graphql/}
      APP_GRAPHQL_CODEGEN_ENDPOINT: ${APP_GRAPHQL_CODEGEN_ENDPOINT:-http://localhost:8000/graphql/}
      APP_MAPBOX_ACCESS_TOKEN: ${APP_MAPBOX_ACCESS_TOKEN}
      
